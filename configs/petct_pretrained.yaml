_base_: default.yaml

foundation:
  enabled: true
  # Path to the MAE-pretrained PlainConvUNet weights from the companion
  # PET/CT foundation-model repository. Not included in this detection repo.
  checkpoint: /path/to/plainconvunet_mae.pth

training:
  output_dir: outputs/petct_pretrained
  epochs: 100
  learning_rate: 0.00001
